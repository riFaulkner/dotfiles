# Manage argo-rollouts -- pluging from [k9s project](https://github.com/derailed/k9s/blob/9050e085814fb83b11c44da6f0ef553d2414aadc/plugins/argo-rollouts.yaml)
# See https://argoproj.github.io/argo-rollouts/
# <g> Get rollout details
# <w> Watch rollout progress
# <p> (with confirmation) Promote rollout
# <r> (with confirmation) Restart rollout
plugins:
  argo-rollouts-get:
    shortCut: g
    confirm: false
    description: Get details
    scopes:
      - rollouts
    command: bash
    background: false
    args:
      - -c
      - kubectl argo rollouts get rollout $NAME --context $CONTEXT -n $NAMESPACE |& less
  argo-rollouts-watch:
    shortCut: Shift-W
    confirm: false
    description: Watch progress
    scopes:
      - rollouts
    command: bash
    background: false
    args:
      - -c
      - kubectl argo rollouts get rollout $NAME --context $CONTEXT -n $NAMESPACE -w
  argo-rollouts-promote:
    shortCut: Shift-P
    confirm: true
    description: Promote
    scopes:
      - rollouts
    command: bash
    background: false
    args:
      - -c
      - kubectl argo rollouts promote $NAME --context $CONTEXT -n $NAMESPACE |& less
  argo-rollouts-restart:
    shortCut: r
    confirm: true
    description: Restart
    scopes:
      - rollouts
    command: bash
    background: false
    args:
      - -c
      - kubectl argo rollouts restart $NAME --context $CONTEXT -n $NAMESPACE |& less
